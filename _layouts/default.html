<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    {%- assign description = page.description | default: site.description %}
    {%- if description %}
    <meta name="description" content="{{ description | strip_html | strip_newlines | escape }}">
    {%- endif %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>

<body>
    <header>
        <div class="header-left">
            <h1>{{ site.title }}</h1>
            <nav class="nav">
                <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>About</a>
                <a href="{{ '/thoughts/' | relative_url }}"{% if page.url contains "/thoughts/" %} class="active"{% endif %}>Thoughts</a>
                <a href="{{ '/projects/' | relative_url }}"{% if page.url == "/projects/" %} class="active"{% endif %}>Projects</a>
            </nav>
        </div>
        <div class="social">
            <a href="https://github.com/dylankhoo" target="_blank" rel="me noopener" aria-label="GitHub" title="GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
            </a>
            <a href="https://www.linkedin.com/in/khoodylan/" target="_blank" rel="me noopener" aria-label="LinkedIn" title="LinkedIn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
            </a>
            <a href="mailto:dylankhooworks@gmail.com" aria-label="Email" title="Email">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </a>
        </div>
    </header>

    <main class="content">
{{ content }}
    </main>
</body>

</html>
